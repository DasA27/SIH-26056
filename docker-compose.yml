services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aerovista
      POSTGRES_USER: aerovista
      POSTGRES_PASSWORD: aerovista
    ports: ["5432:5432"]
    volumes: [aerovista_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U aerovista -d aerovista"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [aerovista_redis:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://aerovista:aerovista@postgres:5432/aerovista
      REDIS_URL: redis://redis:6379/0
      UPDATE_SECONDS: "5"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
volumes:
  aerovista_pg:
  aerovista_redis:
